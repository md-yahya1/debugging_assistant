<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Debugging Assistant</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="header-top">
                    <div class="logo">
                        <span class="logo-icon">🤖</span>
                        <h1>AI Debug Tool</h1>
                    </div>
                    <div class="header-actions">
                        <button id="themeToggle" class="icon-button" aria-label="Toggle Dark Mode">
                            <svg class="sun-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                            <svg class="moon-icon hidden" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                        </button>
                    </div>
                </div>
                <p class="tagline">Instantly find and resolve bugs in your code using advanced AI analysis.</p>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <div class="layout">
                <!-- Input Section -->
                <section class="input-section">
                    <div class="card">
                        <div class="card-header">
                            <div class="header-left">
                                <span class="card-icon">⌨️</span>
                                <h2>Your Code</h2>
                            </div>
                            <div class="header-controls">
                                <select id="languageSelect" class="language-dropdown">
                                    <option value="auto">Auto-detect Language</option>
                                    <option value="python">Python</option>
                                    <option value="javascript">JavaScript / TypeScript</option>
                                    <option value="java">Java</option>
                                    <option value="cpp">C / C++</option>
                                    <option value="csharp">C#</option>
                                    <option value="go">Go</option>
                                    <option value="rust">Rust</option>
                                    <option value="php">PHP</option>
                                    <option value="html">HTML / CSS</option>
                                    <option value="sql">SQL</option>
                                </select>
                                <span class="char-count">0 / 5000</span>
                            </div>
                        </div>
                        <form id="debugForm">
                            <textarea
                                id="codeInput"
                                class="code-input"
                                placeholder="Paste your code or error log here...&#10;&#10;Example:&#10;print('Hello World')&#10;TypeError: unsupported operand type(s) for +: 'int' and 'str'"
                                maxlength="5000"
                            ></textarea>
                            <div class="form-actions">
                                <button type="submit" class="btn btn-primary" id="debugBtn">
                                    <span class="btn-icon">🔍</span>
                                    Debug Code
                                </button>
                                <button type="reset" class="btn btn-secondary">
                                    <span class="btn-icon">🔄</span>
                                    Clear
                                </button>
                            </div>
                        </form>
                    </div>
                </section>

                <!-- Output Section -->
                <section class="output-section">
                    <div class="card">
                        <div class="card-header">
                            <h2>💡 AI Analysis</h2>
                        </div>
                        <div id="outputContainer" class="output-container">
                            <div class="empty-state">
                                <p>👉 Enter your code and click "Debug Code" to start</p>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-content">
                <p>&copy; 2024 AI Debugging Assistant | Powered by Qwen 2.5</p>
                <div class="social-links">
                    <p class="owner-text">Built by <span class="owner-name">Mohammed Yahya</span></p>
                    <a href="https://github.com/md-yahya1" target="_blank" aria-label="GitHub" class="social-icon">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
                    </a>
                    <a href="https://www.linkedin.com/in/mohammed-yahya-4b9879326" target="_blank" aria-label="LinkedIn" class="social-icon">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path><rect x="2" y="9" width="4" height="12"></rect><circle cx="4" cy="4" r="2"></circle></svg>
                    </a>
                </div>
            </div>
        </footer>
    </div>

    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="spinner hidden">
        <div class="spinner-content">
            <div class="spinner-ring"></div>
            <p>Analyzing your code...</p>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
